<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhonoFilm - Discover Movies & TV Shows</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #07090E;
      --card-bg: #111520;
      --card-border: #1E2538;
      --accent: #E5A93B;
      --accent-hover: #D4982A;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 70px;
    }

    header {
      background: rgba(7, 9, 14, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-text h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .btn-add {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .container {
      max-width: 1200px;
      margin: 15px auto;
      padding: 0 15px;
    }

    /* Category Navigation Pills */
    .pill-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 15px;
      scrollbar-width: none;
    }
    .pill-nav::-webkit-scrollbar { display: none; }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 20px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Movie Grid Cards matching PhonoFilm */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .movie-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 900px) {
      .movie-grid { grid-template-columns: repeat(5, 1fr); }
    }

    .movie-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .poster-box {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: #151B28;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .action-icon-btn {
      width: 30px;
      height: 30px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .card-meta {
      padding: 10px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-sub {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-sub .rating {
      color: var(--accent);
      font-weight: 700;
    }

    /* Detail View Screen (PhonoFilm style) */
    .detail-view {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      z-index: 300;
      overflow-y: auto;
      padding-bottom: 50px;
    }

    .detail-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .detail-hero video, .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      z-index: 10;
    }

    .detail-content {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .detail-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .detail-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-action.primary {
      background: var(--accent);
      color: #000;
      border: none;
    }

    /* Modal Form for Admin Add */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 400;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      background: #07090E;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: white;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-text"><h1>PhonoFilm</h1></div>
    </div>
    <div id="adminHeaderAction"></div>
  </header>

  <div class="container" id="homeView">
    <!-- Category Navigation -->
    <div class="pill-nav">
      <div class="pill active">All</div>
      <div class="pill">Movie</div>
      <div class="pill">TV Show</div>
      <div class="pill">Anime</div>
      <div class="pill">Asian</div>
    </div>

    <!-- Search Bar -->
    <div class="search-box" style="margin-bottom: 20px;">
      <input type="text" id="searchInput" placeholder="Search movie name, genre..." onkeyup="filterMovies()" style="width:100%; padding:12px 16px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; color:#fff; outline:none;">
    </div>

    <div class="section-title">Trending Now <i class="fa-solid fa-chevron-right" style="font-size:0.8rem;"></i></div>
    <div class="movie-grid" id="movieGrid"></div>
  </div>

  <!-- Detail View Screen -->
  <div class="detail-view" id="detailView">
    <button class="back-btn" onclick="closeDetail()"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="detail-hero" id="detailHero"></div>
    <div class="detail-content" id="detailContent"></div>
  </div>

  <!-- Admin Add Movie Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>ADD MOVIE ENTRY</h3>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeAddModal()"></i>
      </div>
      <form onsubmit="saveMovie(event)">
        <div class="form-group"><label>Movie Title *</label><input type="text" id="mTitle" required></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group"><label>Year</label><input type="number" id="mYear" value="2026"></div>
          <div class="form-group"><label>IMDb Rating</label><input type="text" id="mRating" value="8.5"></div>
        </div>
        <div class="form-group"><label>Genres (comma separated)</label><input type="text" id="mGenre" value="Action, Sci-Fi"></div>
        <div class="form-group"><label>Poster Image URL</label><input type="url" id="mPoster" placeholder="https://..."></div>
        <div class="form-group"><label>Direct Stream URL *</label><input type="url" id="mStream" required placeholder="https://..."></div>
        <div class="form-group"><label>Direct Download URL *</label><input type="url" id="mDownload" required placeholder="https://..."></div>
        <button type="submit" class="btn-action primary" style="width:100%; margin-top:10px;">SAVE ENTRY</button>
      </form>
    </div>
  </div>

  <script>
    const defaultMovies = [
      {
        id: 1,
        title: "Interstellar",
        year: 2014,
        genre: "Sci-Fi, Adventure",
        rating: "8.7",
        poster: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600",
        streamUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
        downloadUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
        desc: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival."
      },
      {
        id: 2,
        title: "Spider-Man: Across the Spider-Verse",
        year: 2023,
        genre: "Animation, Action",
        rating: "8.6",
        poster: "https://images.unsplash.com/photo-1635805737707-575885ab0820?w=600",
        streamUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
        downloadUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
        desc: "Miles Morales catapults across the Multiverse, where he encounters a team of Spider-People charged with protecting its very existence."
      }
    ];

    let moviesList = JSON.parse(localStorage.getItem('phonofilm_movies')) || defaultMovies;

    function renderMovies(data) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';
      data.forEach(movie => {
        grid.innerHTML += `
          <div class="movie-card" onclick="openDetail(${movie.id})">
            <div class="poster-box">
              <img src="${movie.poster}" alt="${movie.title}">
              <div class="card-actions">
                <div class="action-icon-btn"><i class="fa-solid fa-play"></i></div>
                <div class="action-icon-btn"><i class="fa-solid fa-bookmark"></i></div>
                <div class="action-icon-btn"><i class="fa-solid fa-download"></i></div>
              </div>
            </div>
            <div class="card-meta">
              <div class="card-title">${movie.title}</div>
              <div class="card-sub">
                <span>${movie.year}</span>
                <span class="rating"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openDetail(id) {
      const movie = moviesList.find(m => m.id === id);
      if(!movie) return;

      document.getElementById('detailHero').innerHTML = `<img src="${movie.poster}" alt="${movie.title}">`;
      document.getElementById('detailContent').innerHTML = `
        <div class="detail-title">${movie.title}</div>
        <div style="font-size:0.85rem; color:var(--accent); margin-bottom:10px;">⭐ ${movie.rating} / 10 &nbsp;•&nbsp; ${movie.year} &nbsp;•&nbsp; ${movie.genre}</div>
        <div class="detail-desc">${movie.desc || 'No description available for this title.'}</div>
        
        <div class="action-row">
          <a href="${movie.streamUrl}" target="_blank" class="btn-action primary"><i class="fa-solid fa-play"></i> Stream</a>
          <a href="${movie.downloadUrl}" target="_blank" class="btn-action"><i class="fa-solid fa-download"></i> Download</a>
          <a href="${movie.streamUrl}" target="_blank" class="btn-action"><i class="fa-solid fa-video"></i> Trailer</a>
        </div>
      `;

      document.getElementById('homeView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
    }

    function closeDetail() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
    }

    function filterMovies() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = moviesList.filter(m => m.title.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q));
      renderMovies(filtered);
    }

    function checkAdmin() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('admin') === 'true') {
        document.getElementById('adminHeaderAction').innerHTML = `<button class="btn-add" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> ADD FILE</button>`;
      }
    }

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveMovie(e) {
      e.preventDefault();
      const newMovie = {
        id: Date.now(),
        title: document.getElementById('mTitle').value,
        year: document.getElementById('mYear').value,
        rating: document.getElementById('mRating').value,
        genre: document.getElementById('mGenre').value,
        poster: document.getElementById('mPoster').value || 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600',
        streamUrl: document.getElementById('mStream').value,
        downloadUrl: document.getElementById('mDownload').value,
        desc: "Newly added title to PhonoFilm vault."
      };
      moviesList.unshift(newMovie);
      localStorage.setItem('phonofilm_movies', JSON.stringify(moviesList));
      renderMovies(moviesList);
      closeAddModal();
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAdmin();
      renderMovies(moviesList);
    });
  </script>
</body>
</html>
