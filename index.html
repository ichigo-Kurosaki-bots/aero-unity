<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Unity | Movies & Streaming</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #080B11;
      --card-bg: #0F141F;
      --card-border: #1E2638;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --badge-4k: #2563EB;
      --badge-1080p: #3B82F6;
      --star-color: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 50px;
    }

    /* Top Navbar */
    header {
      background: rgba(15, 20, 31, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: var(--accent);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #fff;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    /* Container & Search */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px 14px 45px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Filters */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .filter-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .filter-group select {
      width: 100%;
      padding: 8px 12px;
      background: #080B11;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    @media (min-width: 640px) {
      .movie-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 900px) {
      .movie-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .movie-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: #151B28;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-rating {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--star-color);
    }

    .badge-quality {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--badge-4k);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .languages-overlay {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      gap: 4px;
    }

    .lang-chip {
      background: rgba(0,0,0,0.75);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      color: #E5E7EB;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .btn-stream {
      margin-top: auto;
      background: transparent;
      border: 1px solid var(--card-border);
      color: #3B82F6;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

    }

    .btn-stream:hover {
      background: rgba(37, 99, 235, 0.1);
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-close {
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      background: #080B11;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: white;
      outline: none;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-film"></i></div>
      <div class="brand-text">
        <h1>Aero Unity Movies</h1>
        <p>Developer: @Mr_Mohammed_29</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-add" id="addFileBtn" style="display:none;" onclick="openAddModal()">
        <i class="fa-solid fa-plus"></i> ADD FILE
      </button>
    </div>
  </header>

  <div class="container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search movie name, audio language, resolution..." onkeyup="filterMovies()">
    </div>

    <div class="filter-panel">
      <div class="filter-group">
        <label>AUDIO</label>
        <select id="audioSelect" onchange="filterMovies()">
          <option value="ALL">All Languages</option>
          <option value="Hindi">Hindi</option>
          <option value="English">English</option>
          <option value="Telugu">Telugu</option>
        </select>
      </div>
      <div class="filter-group">
        <label>QUALITY</label>
        <select id="qualitySelect" onchange="filterMovies()">
          <option value="ALL">All Resolutions</option>
          <option value="4K">4K Ultra HD</option>
          <option value="1080p">1080p Full HD</option>
          <option value="720p">720p HD</option>
        </select>
      </div>
      <div class="filter-group">
        <label>GENRE</label>
        <select id="genreSelect" onchange="filterMovies()">
          <option value="ALL">All Genres</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Action">Action</option>
          <option value="Animation">Animation</option>
        </select>
      </div>
    </div>

    <div class="movie-grid" id="movieGrid"></div>
  </div>

  <!-- Add File Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ADD MOVIE ENTRY</h3>
        <i class="fa-solid fa-xmark modal-close" onclick="closeAddModal()"></i>
      </div>
      <form id="addMovieForm" onsubmit="saveMovie(event)">
        <div class="form-group">
          <label>Movie Title *</label>
          <input type="text" id="movieTitle" required placeholder="e.g. Interstellar">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Year</label>
            <input type="number" id="movieYear" value="2024">
          </div>
          <div class="form-group">
            <label>Genre</label>
            <input type="text" id="movieGenre" placeholder="Sci-Fi, Action">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>IMDb Rating</label>
            <input type="text" id="movieRating" value="8.5">
          </div>
          <div class="form-group">
            <label>Quality</label>
            <input type="text" id="movieQuality" value="4K">
          </div>
        </div>
        <div class="form-group">
          <label>Languages (Comma separated)</label>
          <input type="text" id="movieLangs" value="Hindi, English">
        </div>
        <div class="form-group">
          <label>Poster Image URL</label>
          <input type="url" id="moviePoster" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Direct Stream / Download URL *</label>
          <input type="url" id="movieUrl" required placeholder="https://...">
        </div>
        <button type="submit" class="btn-add" style="width: 100%; justify-content: center; margin-top: 10px;">SAVE ENTRY</button>
      </form>
    </div>
  </div>

  <script>
    const defaultMovies = [
      {
        id: 1,
        title: "Interstellar",
        year: 2014,
        genre: "Sci-Fi",
        rating: "8.7",
        quality: "4K",
        languages: ["Hindi", "English", "+3"],
        filesCount: 2,
        poster: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      },
      {
        id: 2,
        title: "Spider-Man: Across the Spider-Verse",
        year: 2023,
        genre: "Animation",
        rating: "8.6",
        quality: "1080p",
        languages: ["Hindi", "English", "+1"],
        filesCount: 2,
        poster: "https://images.unsplash.com/photo-1635805737707-575885ab0820?w=600",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      }
    ];

    let moviesList = JSON.parse(localStorage.getItem('aero_movies')) || defaultMovies;

    function renderMovies(data) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';
      data.forEach(movie => {
        const langHtml = movie.languages.map(l => `<span class="lang-chip">${l}</span>`).join('');
        grid.innerHTML += `
          <div class="movie-card">
            <div class="poster-wrapper">
              <img src="${movie.poster}" class="poster-img" alt="${movie.title}">
              <div class="badge-rating"><i class="fa-solid fa-star"></i> ${movie.rating}</div>
              <div class="badge-quality">${movie.quality}</div>
              <div class="languages-overlay">${langHtml}</div>
            </div>
            <div class="card-body">
              <div class="movie-title">${movie.title}</div>
              <div class="movie-meta">
                <span>${movie.year}</span>
                <span>${movie.genre}</span>
              </div>
              <button class="btn-stream" onclick="openMedia('${movie.url}')">
                <i class="fa-solid fa-play"></i> ▶ Stream ${movie.filesCount || 1} Files >
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterMovies() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const audio = document.getElementById('audioSelect').value;
      const quality = document.getElementById('qualitySelect').value;
      const genre = document.getElementById('genreSelect').value;

      const filtered = moviesList.filter(m => {
        const matchesQ = m.title.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q);
        const matchesAudio = audio === 'ALL' || m.languages.includes(audio);
        const matchesQuality = quality === 'ALL' || m.quality.includes(quality);
        const matchesGenre = genre === 'ALL' || m.genre.includes(genre);
        return matchesQ && matchesAudio && matchesQuality && matchesGenre;
      });

      renderMovies(filtered);
    }

    function openMedia(url) {
      window.open(url, '_blank');
    }

    function checkAdmin() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('admin') === 'true') {
        document.getElementById('addFileBtn').style.display = 'flex';
      }
    }

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveMovie(e) {
      e.preventDefault();
      const newMovie = {
        id: Date.now(),
        title: document.getElementById('movieTitle').value,
        year: document.getElementById('movieYear').value,
        genre: document.getElementById('movieGenre').value,
        rating: document.getElementById('movieRating').value,
        quality: document.getElementById('movieQuality').value,
        languages: document.getElementById('movieLangs').value.split(',').map(s => s.trim()),
        filesCount: 1,
        poster: document.getElementById('moviePoster').value || 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600',
        url: document.getElementById('movieUrl').value
      };
      moviesList.unshift(newMovie);
      localStorage.setItem('aero_movies', JSON.stringify(moviesList));
      renderMovies(moviesList);
      closeAddModal();
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAdmin();
      renderMovies(moviesList);
    });
  </script>
</body>
</html>
